name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - run: gradle :core:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: core/build/reports/tests/
  build:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Compile and remap production jar
        run: gradle -p ${{ matrix.loader }} build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: playguard-${{ matrix.loader }}-1.20.1
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: playguard-*
          path: artifacts
          merge-multiple: true
      - name: Publish jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.jar --repo "$GITHUB_REPOSITORY" --generate-notes
