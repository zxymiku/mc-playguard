plugins { id 'net.minecraftforge.gradle' version '6.0.36' }
version = '1.0.0'
group = 'io.github.zxymiku.playguard'
base { archivesName = 'playguard-neoforge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
    mavenCentral()
}
dependencies { minecraft 'net.neoforged:forge:1.20.1-47.1.106' }
sourceSets.main.java.srcDirs += ['../common/src/main/java', '../core/src/main/java', '../forge/src/main/java']
sourceSets.main.resources.srcDirs += ['../forge/src/main/resources']
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
