plugins { id 'net.minecraftforge.gradle' version '6.0.36' }
version = '1.0.0'
group = 'io.github.zxymiku.playguard'
base { archivesName = 'playguard-forge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
sourceSets.main.java.srcDirs += ['../common/src/main/java', '../core/src/main/java']
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
